<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SpendTrack</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>
    <div class="login-left">
        <div class="logo">SpendTrack</div>
        <div class="login-left-content">
            <h1>Create a stronger password</h1>
            <p>Use at least 8 characters with a mix of letters, numbers, and symbols.</p>
        </div>
    </div>
    <div class="login-right">
        <div class="login-form-container">
            <div class="login-form-header">
                <h2>Reset password</h2>
                <p><a href="login.html">Back to login</a></p>
            </div>
            <div class="success-message" id="messageBox"><span></span></div>
            <form id="resetForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" id="email" name="email" type="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="token">Reset token</label>
                    <input class="form-input" id="token" name="token" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">New password</label>
                    <input class="form-input" id="password" name="password" type="password" minlength="8" required>
                </div>
                <button class="btn btn-primary" type="submit" id="submitBtn">Reset Password</button>
            </form>
        </div>
    </div>
    <script>
    document.getElementById('email').value = sessionStorage.getItem('resetEmail') || '';
    document.getElementById('token').value = sessionStorage.getItem('resetToken') || '';
    document.getElementById('resetForm').addEventListener('submit', async event => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(event.target).entries());
        const button = document.getElementById('submitBtn');
        const messageBox = document.getElementById('messageBox');
        button.disabled = true;
        button.textContent = 'Updating...';
        const response = await fetch('../api/account.php?action=reset_password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await response.json();
        button.disabled = false;
        button.textContent = 'Reset Password';
        messageBox.classList.add('show');
        messageBox.querySelector('span').textContent = data.message;
        if (data.success) {
            sessionStorage.removeItem('resetEmail');
            sessionStorage.removeItem('resetToken');
            setTimeout(() => window.location.href = 'login.html', 1400);
        }
    });
    </script>
</body>
</html>
